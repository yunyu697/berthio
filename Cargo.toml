[package]
name = "berthio"
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
description = "Berthio 服务端入站代理面板（控制面）"
license = "Apache-2.0"

[[bin]]
name = "berthio"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# 规则集换源下载需要 HTTPS；ureq + rustls（不依赖系统 OpenSSL），便于 Windows/CI 一致。
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
# 3x-ui 迁移只读读取 SQLite 快照；bundled 让 Windows/Linux/CI 行为一致，不依赖系统 sqlite3。
rusqlite = { version = "0.32", features = ["bundled"] }
# 自更新只做 minisign 验签（Ed25519），不引入完整 minisign 工具链。
minisign-verify = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
